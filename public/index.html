    />

    <!-- PWA / cara de app no celular -->

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      if (window.pdfjsLib) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      }
    </script>
    <title>Receitas Milionárias</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
      integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A=="
      crossorigin=""
    />
    <link
      href="https://fonts.googleapis.com/css?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Two+Tone|Material+Icons+Round|Material+Icons+Sharp"
      rel="stylesheet"
    />
    <script
      defer
      data-site="YOUR_DOMAIN_HERE"
      src="https://api.nepcha.com/js/nepcha-analytics.js"
    ></script>

    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      html,
      body {
        margin: 0;
        background-color: #0f2a1e;
        /* evita o "bounce"/overscroll que entrega que é navegador */
        overscroll-behavior-y: none;
        -webkit-text-size-adjust: 100%;
      }
      /* cara de app: sem realce azul ao tocar, sem seleção acidental de UI */
      body {
        -webkit-tap-highlight-color: transparent;
      }
      /* permite seleção em campos e conteúdo, bloqueia em elementos de UI */
      input,
      textarea,
      [contenteditable="true"],
      .selectable {
        -webkit-user-select: text;
        user-select: text;
      }
      /* quando instalado (standalone), trava em retrato visualmente como reforço */
      @media all and (display-mode: standalone) and (orientation: landscape) {
        /* aviso opcional poderia entrar aqui; o lock real vem do manifest + JS */
      }
    </style>

    <script>
      // Trava de orientação (retrato) — funciona em PWA instalado / fullscreen.
      // No navegador comum o lock é ignorado silenciosamente (sem erro fatal).
      (function lockPortrait() {
        function tryLock() {
          try {
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock("portrait").catch(function () {});
            }
          } catch (e) {
            /* navegador não suporta — manifest cuida no PWA */
          }
        }
        tryLock();
        window.addEventListener("orientationchange", tryLock);
      })();
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="app"></div>
  </body>
</html>
